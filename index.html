<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הרשמה | התוועדות חג הגאולה י"ט כסלו – נשות גני טל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy:#6b1d30;
    --burgundy-dark:#4f1322;
    --blush:#e9d3d2;
    --blush-soft:#f3e6e3;
    --cream:#f8f1ea;
    --gold:#b8955a;
    --gold-light:#d9c39a;
    --text:#4a2a2f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Heebo',sans-serif;
    background:radial-gradient(circle at top,#fbf6f1 0%,var(--cream) 45%,#efe2da 100%);
    color:var(--text);
    min-height:100vh;
    padding:24px 14px 40px;
  }
  .card{
    max-width:520px;margin:0 auto;
    background:#fffaf6;
    border-radius:260px 260px 22px 22px;
    border:1.5px solid var(--gold-light);
    box-shadow:0 12px 40px rgba(107,29,48,.12);
    padding:18px 18px 28px;
    position:relative;
  }
  .card::before{
    content:"";position:absolute;inset:7px;
    border:1px solid rgba(184,149,90,.45);
    border-radius:252px 252px 16px 16px;
    pointer-events:none;
  }
  .invite{
    display:block;width:100%;height:auto;
    border-radius:240px 240px 14px 14px;
  }
  .divider{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin:22px 0 6px;color:var(--gold);
  }
  .divider span{height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold))}
  .divider span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
  h1{
    font-family:'Frank Ruhl Libre',serif;font-weight:900;
    color:var(--burgundy);text-align:center;font-size:30px;margin-top:4px;
  }
  .sub{text-align:center;color:#7d5a5f;font-size:15px;margin:4px 0 20px}
  form{padding:0 6px}
  label.field{display:block;font-weight:500;margin-bottom:14px;font-size:15px}
  label.field input{
    display:block;width:100%;margin-top:6px;
    padding:13px 14px;font-size:16px;font-family:inherit;
    border:1.5px solid var(--blush);border-radius:12px;
    background:#fff;color:var(--text);transition:border-color .2s, box-shadow .2s;
  }
  label.field input:focus{
    outline:none;border-color:var(--burgundy);
    box-shadow:0 0 0 3px rgba(107,29,48,.12);
  }
  .check{
    display:flex;align-items:center;gap:12px;
    background:var(--blush-soft);border:1.5px solid var(--blush);
    border-radius:14px;padding:14px 16px;margin:6px 0 20px;
    cursor:pointer;font-weight:700;color:var(--burgundy);font-size:16px;
  }
  .check input{
    appearance:none;-webkit-appearance:none;flex-shrink:0;
    width:24px;height:24px;border:2px solid var(--burgundy);border-radius:7px;
    background:#fff;display:grid;place-content:center;cursor:pointer;
  }
  .check input::before{
    content:"";width:12px;height:12px;transform:scale(0);transition:transform .15s;
    background:var(--burgundy);
    clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0,43% 62%);
  }
  .check input:checked::before{transform:scale(1)}
  button{
    width:100%;padding:15px;font-size:18px;font-weight:800;font-family:inherit;
    color:#fff;border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(135deg,var(--burgundy),var(--burgundy-dark));
    box-shadow:0 6px 18px rgba(107,29,48,.3);
    border-top:2px solid var(--gold-light);
    transition:transform .15s, opacity .2s;
  }
  button:active{transform:scale(.98)}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#a3203a;font-size:14px;text-align:center;margin-top:10px;min-height:18px}
  .thanks{display:none;text-align:center;padding:10px 10px 0}
  .thanks .icon{
    width:70px;height:70px;margin:0 auto 12px;border-radius:50%;
    background:var(--blush-soft);border:2px solid var(--gold-light);
    display:grid;place-content:center;color:var(--burgundy);font-size:34px;
  }
  .thanks h2{font-family:'Frank Ruhl Libre',serif;color:var(--burgundy);font-size:28px}
  .thanks p{margin-top:8px;font-size:16px;line-height:1.6}
  .footer{text-align:center;margin-top:22px;font-size:13px;color:#8d6d71}
  .footer a{color:var(--burgundy);font-weight:700;text-decoration:none}
</style>
</head>

    <div class="divider"><span></span>◆<span></span></div>
    <h1>הרשמה להתוועדות</h1>
    <p class="sub">יום שלישי, כ״א כסלו (1/12/26) · 20:00 · מועדון גני טל</p>

    <form id="regForm" novalidate>
      <label class="field">שם פרטי
        <input type="text" name="firstName" id="firstName" autocomplete="given-name" required>
      </label>
      <label class="field">שם משפחה
        <input type="text" name="lastName" id="lastName" autocomplete="family-name" required>
      </label>
      <label class="check">
        <input type="checkbox" name="attending" id="attending">
        גם אני אגיע ואשתתף בהתוועדות
      </label>
      <button type="submit" id="submitBtn">שליחה</button>
      <div class="err" id="err"></div>
    </form>

    <div class="thanks" id="thanks">
      <div class="icon">✓</div>
      <h2>תודה שנרשמת!</h2>
      <p>מחכות לך בהתוועדות<br>ביום שלישי, כ״א כסלו בשעה 20:00<br>במועדון גני טל</p>
    </div>

    <div class="footer">לבירורים: רחלי · <a href="tel:0528770283">052-877-0283</a></div>
  </div>

<script>
  // ⬇️ הדבק כאן את כתובת ה-Web App של Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykrKoGpQcZJOLImXDwiRuo8PDqrpotD3Kwma66gdAM57jTO4rTF-o8Ao4nVhJllobW/exec";

  const form = document.getElementById('regForm');
  const err = document.getElementById('err');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const first = document.getElementById('firstName').value.trim();
    const last = document.getElementById('lastName').value.trim();
    const attending = document.getElementById('attending').checked;

    if (!first || !last) { err.textContent = 'נא למלא שם פרטי ושם משפחה'; return; }
    if (!attending) { err.textContent = 'נא לסמן "גם אני אגיע ואשתתף בהתוועדות"'; return; }

    btn.disabled = true; btn.textContent = 'שולחת...';
    try {
      const body = new URLSearchParams({
        firstName: first, lastName: last, attending: attending ? 'כן' : 'לא'
      });
      await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body });
      form.style.display = 'none';
      document.getElementById('thanks').style.display = 'block';
      document.getElementById('thanks').scrollIntoView({behavior:'smooth', block:'center'});
    } catch (ex) {
      err.textContent = 'אירעה שגיאה בשליחה, נסי שוב';
      btn.disabled = false; btn.textContent = 'שליחה';
    }
  });
</script>
